name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip Godot_v4.2.1-stable_linux.x86_64.zip
          mv Godot_v4.2.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --export-release "Android" build/game.apk
      - uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: build/game.apk
